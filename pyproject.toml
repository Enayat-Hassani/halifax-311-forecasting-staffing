[project]
name = "wfm-forecasting-benchmark"
version = "0.0.0"
description = "Benchmark of time-series foundation models against classical and ML baselines on the Halifax 311 contact-centre demand series, with an Erlang staffing and cost layer."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=8",
]

# This is an application, not an installable library, so uv does not try to
# build it. The source is put on the path for tests via pytest below.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
